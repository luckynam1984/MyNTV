name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Build flavor (full or playstore)
        required: true
        default: full
        type: choice
        options:
          - full
          - playstore

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (debug signing, no keystore needed)
        env:
          CI_USE_DEBUG_SIGNING: true
        run: |
          ./gradlew assembleFullDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-full-debug.apk
          path: app/build/outputs/apk/full/debug/*.apk
          retention-days: 7
