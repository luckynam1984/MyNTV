name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Generate temporary keystore
        run: |
          keytool -genkey -v             -keystore nuviotv.jks             -alias nuviotv             -keyalg RSA -keysize 2048 -validity 3650             -storepass 815787 -keypass 815787             -dname "CN=Build, OU=Build, O=Build, L=Build, S=Build, C=US"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write local.properties
        run: |
          cat > local.properties << 'EOF'
          SUPABASE_URL=https://tesvawybtfapbewjemmh.supabase.co
          SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlc3Zhd3lidGZhcGJld2plbW1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NzgwMTEsImV4cCI6MjA5NzQ1NDAxMX0.c0wimWZVjLwwl1KDnCeG2AdoI2eDtQKdg-yXxsDASUw
          NUVIO_SUPABASE_URL=https://tesvawybtfapbewjemmh.supabase.co
          NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlc3Zhd3lidGZhcGJld2plbW1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NzgwMTEsImV4cCI6MjA5NzQ1NDAxMX0.c0wimWZVjLwwl1KDnCeG2AdoI2eDtQKdg-yXxsDASUw
          EOF

      - name: Build APK
        run: ./gradlew assembleFullDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyNTV-debug.apk
          path: app/build/outputs/apk/full/debug/*.apk
          retention-days: 7
